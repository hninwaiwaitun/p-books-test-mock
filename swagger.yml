# ==========================================
  # Menus (Sidebar)
  # ==========================================
  /menus:
    get:
      tags:
        - Dashboard
      summary: サイドバーメニューの取得
      description: ログインユーザーの権限に応じた、表示可能なメニュー項目のリストを取得します。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'